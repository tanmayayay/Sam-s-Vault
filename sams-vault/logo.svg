<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sam's Vault">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7BFF"/>
      <stop offset="0.55" stop-color="#3D5CF5"/>
      <stop offset="1" stop-color="#2233B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1460" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- Vault door -->
    <circle cx="256" cy="256" r="164" fill="#FFFFFF" fill-opacity="0.12"/>
    <circle cx="256" cy="256" r="164" fill="none" stroke="#FFFFFF" stroke-width="30"/>
    <!-- Locking bolts set into the rim -->
    <g fill="#3D5CF5"><circle cx="420.0" cy="256.0" r="7.5"/><circle cx="372.0" cy="372.0" r="7.5"/><circle cx="256.0" cy="420.0" r="7.5"/><circle cx="140.0" cy="372.0" r="7.5"/><circle cx="92.0" cy="256.0" r="7.5"/><circle cx="140.0" cy="140.0" r="7.5"/><circle cx="256.0" cy="92.0" r="7.5"/><circle cx="372.0" cy="140.0" r="7.5"/></g>
    <!-- Inner ring -->
    <circle cx="256" cy="256" r="122" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.45"/>
    <!-- Dial -->
    <circle cx="256" cy="256" r="96" fill="url(#dial)"/>
    <!-- Keyhole -->
    <path fill="#2E45D6" d="M256 202a29 29 0 0 1 16.4 52.9l8.7 48.4a6 6 0 0 1-5.9 7h-38.4a6 6 0 0 1-5.9-7l8.7-48.4A29 29 0 0 1 256 202z"/>
  </g>
</svg>
